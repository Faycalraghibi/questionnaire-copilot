[project]
name = "questionnaire-copilot"
version = "0.1.0"
description = "Answer security questionnaires from your current policies, with a source for every answer."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.50.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "openai>=1.70.0",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.0",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0.3",
    "reportlab>=5.1.0",
    "sentence-transformers>=3.0.0",
    "streamlit>=1.40.0",
    "torch>=2.5.0",
    "uvicorn>=0.32.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "qc"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"
# Specs are input documents: never reformat them (ruff also formats Markdown code blocks).
extend-exclude = ["specs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls a paid model API (never run by make test)",
    "slow: slow tests (real embedding model, full pipeline)",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
