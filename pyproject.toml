[project]
name = "questionnaire-copilot"
version = "0.1.0"
description = "Answer security questionnaires from your current policies, with a source for every answer."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "reportlab>=5.1.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "qc"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls a paid model API (never run by make test)",
    "slow: slow tests (real embedding model, full pipeline)",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
