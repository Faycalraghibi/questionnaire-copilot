services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qc}
      POSTGRES_DB: ${POSTGRES_DB:-qc}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - qc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  qc_pgdata:
